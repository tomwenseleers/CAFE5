name: Innovation model validation
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ zlib1g-dev python3-numpy python3-scipy
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wno-error=deprecated-declarations -Wno-error=stringop-overflow"
          cmake --build build --target cafe5 tests -j 2
      - name: Legacy tests
        run: ./build/tests
      - name: Independent innovation checks
        run: python3 scripts/innovation/validate.py build/cafe5 validation/numerical
      - name: Simulation recovery and fixed-parameter calibration
        run: python3 scripts/innovation/recovery.py build/cafe5 validation/recovery --replicates 12
      - name: Gamma and error mixture validation
        run: python3 scripts/innovation/validate_mixtures.py build/cafe5 validation/mixtures
      - name: Branch test calibration smoke check
        run: python3 scripts/innovation/validate_branches.py build/cafe5 validation/branches --outer-replicates 1
      - name: Estimated Poisson root-law validation
        run: python3 scripts/innovation/validate_root_fit.py build/cafe5 validation/root_fit
      - name: Transition-score and one-percent null check
        run: python3 scripts/innovation/validate_transition_bootstrap.py build/cafe5 validation/transition_bootstrap
      - name: Asymmetric rates, hurdle roots and separate zero-error validation
        run: python3 scripts/innovation/validate_improvements.py build/cafe5 validation/improvements
      - name: Conditional recovery of added model parameters
        run: python3 scripts/innovation/validate_improvement_recovery.py build/cafe5 validation/improvement_recovery
      - name: Exact conditional simulation at rare-observation boundaries
        run: python3 scripts/innovation/validate_conditional_simulation.py build/cafe5 validation/conditional_simulation
